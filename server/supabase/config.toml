# Configuración mínima de Supabase CLI / integración con GitHub.
# En Supabase: Project Settings → Integrations → GitHub, Working directory = "server".
project_id = "motores-pesados-v1"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"
